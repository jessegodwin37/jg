<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Enroll in a JG learning course and begin building practical skills."
  >

  <meta name="theme-color" content="#2563eb">

  <title>Enrollment | JG — Find Skills. Find Work.</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       JG ENROLLMENT — PAGE SPECIFIC STYLES
       ========================================================= */

    .enrollment-page {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .enrollment-hero {
      position: relative;
      overflow: hidden;
      padding: 34px 0 24px;
    }

    .enrollment-hero::before {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      top: -210px;
      right: -150px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.10);
      pointer-events: none;
    }

    .enrollment-hero-inner {
      position: relative;
      z-index: 1;
    }

    .enrollment-breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .enrollment-breadcrumb a {
      color: var(--muted);
    }

    .enrollment-breadcrumb a:hover {
      color: var(--primary);
    }

    .enrollment-breadcrumb-current {
      color: var(--text);
      font-weight: 750;
    }

    .enrollment-hero h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .enrollment-gradient {
      background: linear-gradient(
        120deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .enrollment-hero p {
      max-width: 700px;
      margin: 15px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.93rem;
    }

    /* =========================================================
       PROGRESS
       ========================================================= */

    .enrollment-progress {
      margin: 16px 0 25px;
    }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
    }

    .progress-number {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .progress-step.active {
      border-color: rgba(37, 99, 235, 0.30);
      background: rgba(37, 99, 235, 0.06);
    }

    .progress-step.active .progress-number {
      background: var(--primary);
      color: #fff;
    }

    .progress-step.complete .progress-number {
      background: #16a34a;
      color: #fff;
    }

    .progress-text strong {
      display: block;
      font-size: 0.72rem;
    }

    .progress-text span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.64rem;
    }

    /* =========================================================
       MAIN GRID
       ========================================================= */

    .enrollment-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 23px;
      align-items: start;
      padding-bottom: 60px;
    }

    .enrollment-main {
      min-width: 0;
    }

    .enrollment-sidebar {
      position: sticky;
      top: 80px;
      display: grid;
      gap: 13px;
    }

    .enrollment-card {
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .enrollment-card + .enrollment-card {
      margin-top: 14px;
    }

    .card-heading {
      margin-bottom: 17px;
    }

    .card-heading h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.025em;
    }

    .card-heading p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.76rem;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }
