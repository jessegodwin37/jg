<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="description"
    content="JG AI — Your intelligent learning, coding, career and creative assistant."
  >

  <meta name="theme-color" content="#2563eb">

  <title>JG AI | Intelligent Assistant</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       JG AI
       Premium AI Workspace
    ========================================================= */

    html,
    body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--background);
    }

    .ai-page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(37, 99, 235, 0.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(124, 58, 237, 0.08),
          transparent 30%
        ),
        var(--background);
    }

    /* =========================================================
       AI HERO
    ========================================================= */

    .ai-hero {
      position: relative;
      width: 100%;
      padding: 56px 20px 24px;
    }

    .ai-hero-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .ai-hero-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 34px;
      background:
        linear-gradient(
          135deg,
          rgba(37, 99, 235, 0.11),
          rgba(124, 58, 237, 0.08),
          rgba(6, 182, 212, 0.06)
        ),
        var(--surface);
      box-shadow: var(--shadow-md);
    }

    .ai-hero-card::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      right: -80px;
      top: -90px;
      background: rgba(37, 99, 235, 0.10);
      filter: blur(4px);
      pointer-events: none;
    }

    .ai-hero-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      left: -100px;
      bottom: -110px;
      background: rgba(124, 58, 237, 0.08);
      pointer-events: none;
    }

    .ai-hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }

    .ai-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      margin-bottom: 16px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .ai-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.10);
    }

    .ai-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
    }

    .ai-title span {
      background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .ai-description {
      max-width: 700px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .ai-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    /* =========================================================
       AI WORKSPACE
    ========================================================= */

    .ai-workspace {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto 70px;
    }

    .ai-workspace-grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .ai-sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .ai-sidebar-title {
      margin: 4px 6px 14px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .ai-mode-list {
      display: grid;
      gap: 8px;
    }

    .ai-mode {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font: inherit;
