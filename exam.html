<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Complete your JG course assessment and track your learning progress."
  >

  <meta name="theme-color" content="#2563eb">

  <title>Assessment | JG — Find Skills. Find Work.</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       JG EXAM — PAGE-SPECIFIC STYLES
       ========================================================= */

    .exam-page {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .exam-hero {
      padding: 30px 0 20px;
    }

    .exam-breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: .76rem;
    }

    .exam-breadcrumb a {
      color: var(--muted);
    }

    .exam-breadcrumb a:hover {
      color: var(--primary);
    }

    .exam-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .exam-title h1 {
      margin: 0;
      font-size: clamp(1.9rem, 5vw, 3rem);
      line-height: 1.02;
      letter-spacing: -.05em;
    }

    .exam-title p {
      max-width: 650px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.6;
    }

    .exam-title-gradient {
      background: linear-gradient(
        120deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* =========================================================
       EXAM STATUS BAR
       ========================================================= */

    .exam-status {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .status-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: .95rem;
    }

    .status-card span {
      display: block;
      color: var(--muted);
      font-size: .63rem;
    }

    .status-card strong {
      display: block;
      margin-top: 3px;
      font-size: .82rem;
    }

    .timer-card {
      border-color: rgba(37, 99, 235, .22);
      background: rgba(37, 99, 235, .045);
    }

    .timer-value {
      font-variant-numeric: tabular-nums;
    }

    .timer-warning {
      color: #b45309 !important;
    }

    .timer-danger {
      color: #dc2626 !important;
    }

    /* =========================================================
       EXAM LAYOUT
       ========================================================= */

    .exam-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
      padding-bottom: 60px;
    }

    .exam-main {
      min-width: 0;
    }

    .exam-sidebar {
      position: sticky;
      top: 80px;
      display: grid;
      gap: 13px;
    }

    /* =========================================================
       QUESTION CARD
       ========================================================= */

    .question-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .question-label {
      color: var(--primary);
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .question-number {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 750;
    }

    .question-progress {
      height: 5px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-2);
    }

    .question-progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary)
      );
      transition: width .25s ease;
    }

    .question-content {
      padding: 24px 0 18px;
    }

    .question-content h2 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      line-height: 1.4;
      letter-spacing: -.025em;
    }

    .question-hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: .7rem;
    }

    /* =========================================================
       ANSWERS
       ========================================================= */

    .answers {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .answer {
      position: relative;
    }
