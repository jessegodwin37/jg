<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="JG Learning — Learn practical digital skills step by step.">

    <title>JG Learning | Lessons</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================================
           LESSON PAGE
        ========================================= */

        .lesson-page {
            min-height: 100vh;
            background: var(--background);
        }

        .lesson-hero {
            padding: 55px 20px 35px;
            border-bottom: 1px solid var(--border);
            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.10),
                    transparent 35%
                );
        }

        .lesson-container {
            max-width: 1250px;
            margin: auto;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .lesson-hero h1 {
            margin: 0 0 12px;
            color: var(--text);
            font-size: clamp(34px, 5vw, 55px);
            letter-spacing: -1.5px;
        }

        .lesson-hero p {
            max-width: 750px;
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* =========================================
           MAIN LAYOUT
        ========================================= */

        .lesson-layout {
            max-width: 1250px;
            margin: 35px auto 80px;
            padding: 0 20px;

            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 25px;

            align-items: start;
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .lesson-sidebar {
            position: sticky;
            top: 20px;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .course-summary {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .course-icon {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;
            background: rgba(37, 99, 235, 0.10);

            font-size: 25px;

            margin-bottom: 16px;
        }

        .course-summary h2 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 21px;
        }

        .course-summary p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .progress-area {
            margin-top: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 8px;

            font-size: 13px;
            color: var(--text-secondary);
        }

        .progress-info strong {
            color: var(--text);
        }

        .progress-bar {
            height: 9px;

            background: var(--border);

            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            background: var(--primary);

            border-radius: inherit;

            transition: width 0.3s ease;
        }

        .lesson-list-title {
            padding: 18px 22px 10px;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lesson-list {
            padding: 8px 12px 16px;
        }

        .lesson-item {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px 12px;

            border: 0;
            border-radius: 14px;

            background: transparent;

            color: var(--text);

            text-align: left;

            cursor: pointer;

            font: inherit;

            transition: 0.2s ease;
        }

        .lesson-item:hover {
            background: var(--background);
        }

        .lesson-item.active {
            background: rgba(37, 99, 235, 0.10);
            color: var(--primary);
        }

        .lesson-item.completed {
            opacity: 0.8;
        }

        .lesson-number {
            flex: 0 0 auto;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: var(--background);
            border: 1px solid var(--border);

            font-size: 12px;
            font-weight: 800;
        }

        .lesson-item.active .lesson-number {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .lesson-item.completed .lesson-number {
            background: #16a34a;
            color: white;
            border-color: #16a34a;
        }

        .lesson-item-info {
            min-width: 0;
        }

        .lesson-item-title {
            display: block;

            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lesson-item-duration {
            display: block;

            margin-top: 3px;

            color: var(--text-secondary);

            font-size: 11px;
        }

        /* =========================================
           COURSE SWITCHER
        ========================================= */

        .course-switcher {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .course-switcher label {
            display: block;
            margin-bottom: 8px;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 800;
        }

        .course-select {
            width: 100%;

            padding: 12px 13px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: var(--background);
            color: var(--text);

            font: inherit;

            outline: none;
        }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        .lesson-content {
            min-width: 0;
        }

        .lesson-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 26px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .lesson-heading {
            padding: 30px 32px 24px;
            border-bottom: 1px solid var(--border);
        }

        .lesson-tag {
            display: inline-flex;

            padding: 7px 11px;

            border-radius: 999px;

            background: rgba(37, 99, 235, 0.10);
            color: var(--primary);

            font-size: 12px;
            font-weight: 800;

            margin-bottom: 14px;
        }

        .lesson-heading h2 {
            margin: 0 0 10px;

            color: var(--text);

            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.15;
        }

        .lesson-heading p {
            margin: 0;

            color: var(--text-secondary);

            line-height: 1.7;
        }

        /* =========================================
           VIDEO
        ========================================= */

        .video-placeholder {
            margin: 28px 32px;

            min-height: 350px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(37, 99, 235, 0.12),
                    rgba(124, 58, 237, 0.12)
                );

            border: 1px solid var(--border);

            position: relative;
            overflow: hidden;
        }

        .video-placeholder::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(37, 99, 235, 0.08);

            top: -80px;
            right: -50px;
        }

        .video-content {
            position: relative;
            z-index: 1;
        }

        .play-button {
            width: 75px;
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: var(--primary);
            color: white;

            font-size: 27px;

            box-shadow:
                0 12px 30px
                rgba(37, 99, 235, 0.25);
        }

        .video-content h3 {
            margin: 0 0 8px;

            color: var(--text);

            font-size: 22px;
        }

        .video-content p {
            margin: 0;

            color: var(--text-secondary);

            font-size: 14px;
        }

        /* =========================================
           LESSON BODY
        ========================================= */

        .lesson-body {
            padding: 0 32px 32px;
        }

        .lesson-body h3 {
            margin: 28px 0 12px;

            color: var(--text);

            font-size: 23px;
        }

        .lesson-body p {
            color: var(--text-secondary);

            line-height: 1.8;
        }

        .topic-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 18px;
        }

        .topic {
            padding: 16px;

            border-radius: 15px;

            background: var(--background);

            border: 1px solid var(--border);

            color: var(--text);

            font-size: 14px;
            font-weight: 600;
        }

        .topic::before {
            content: "✓";

            color: var(--primary);

            font-weight: 900;

            margin-right: 8px;
        }

        /* =========================================
           QUIZ
        ========================================= */

        .quiz-box {
            margin-top: 35px;

            padding: 25px;

            border-radius: 20px;

            background: var(--background);

            border: 1px solid var(--border);
        }

        .quiz-box h3 {
            margin-top: 0;
        }

        .quiz-question {
            color: var(--text);

            font-weight: 800;

            line-height: 1.6;

            margin-bottom: 15px;
        }

        .quiz-options {
            display: grid;
            gap: 10px;
        }

        .quiz-option {
            width: 100%;

            padding: 13px 15px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: var(--surface);

            color: var(--text);

            text-align: left;

            cursor: pointer;

            font: inherit;

            transition: 0.2s ease;
        }

        .quiz-option:hover {
            border-color: var(--primary);
        }

        .quiz-option.correct {
            border-color: #16a34a;
            background: rgba(22, 163, 74, 0.08);
        }

        .quiz-option.wrong {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.08);
        }

        .quiz-result {
            display: none;

            margin-top: 15px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 700;
        }

        .quiz-result.show {
            display: block;
        }

        /* =========================================
           LESSON ACTIONS
        ========================================= */

        .lesson-actions {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 22px 32px;

            border-top: 1px solid var(--border);
        }

        .action-btn {
            min-height: 46px;

            padding: 0 18px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: var(--surface);

            color: var(--text);

            font: inherit;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .complete-status {
            display: none;

            color: #16a34a;

            font-size: 13px;
            font-weight: 800;
        }

        .complete-status.show {
            display: block;
        }

        /* =========================================
           BOTTOM INFO
        ========================================= */

        .lesson-info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 15px;

            margin-top: 20px;
        }

        .info-card {
            padding: 20px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 18px;
        }

        .info-card span {
            display: block;

            color: var(--text-secondary);

            font-size: 12px;

            margin-bottom: 6px;
        }

        .info-card strong {
            color: var(--text);

            font-size: 15px;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 950px) {

            .lesson-layout {
                grid-template-columns: 1fr;
            }

            .lesson-sidebar {
                position: static;
            }

            .lesson-list {
                display: grid;

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 5px;
            }

            .lesson-info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {

            .lesson-hero {
                padding-top: 40px;
            }

            .lesson-layout {
                padding: 0 14px;
            }

            .lesson-heading {
                padding: 24px 20px 20px;
            }

            .lesson-body {
                padding: 0 20px 25px;
            }

            .video-placeholder {
                margin: 22px 20px;

                min-height: 230px;
            }

            .lesson-actions {
                padding: 18px 20px;

                flex-wrap: wrap;
            }

            .lesson-actions .action-btn {
                flex: 1;
            }
