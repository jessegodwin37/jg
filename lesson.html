<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JG | Course Lesson</title>

<meta name="description"
      content="Learn practical digital skills with JG.">

<link rel="stylesheet"
      href="css/style.css">

<style>

/* =====================================================
   LESSON PAGE
===================================================== */

.lesson-page {
    min-height: 100vh;
    background: #f5f7fb;
    padding: 115px 20px 70px;
}

.lesson-container {
    max-width: 1200px;
    margin: auto;
}


/* =====================================================
   TOP BAR
===================================================== */

.lesson-top {
    background: #ffffff;
    border-radius: 20px;
    padding: 20px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(15,23,42,.06);
}

.lesson-course-name {
    display: flex;
    align-items: center;
    gap: 14px;
}

.lesson-course-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

.lesson-course-name h1 {
    margin: 0 0 4px;
    font-size: 22px;
}

.lesson-course-name p {
    margin: 0;
    color: #64748b;
}


/* =====================================================
   PROGRESS
===================================================== */

.lesson-progress-box {
    min-width: 260px;
}

.lesson-progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 7px;
}

.lesson-progress {
    height: 9px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
}

.lesson-progress span {
    display: block;
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width .4s ease;
}


/* =====================================================
   MAIN GRID
===================================================== */

.lesson-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 22px;
}


/* =====================================================
   LESSON SIDEBAR
===================================================== */

.lesson-sidebar {
    background: #ffffff;
    border-radius: 20px;
    padding: 20px;
    height: fit-content;
    box-shadow: 0 10px 30px rgba(15,23,42,.06);
}

.lesson-sidebar h2 {
    font-size: 18px;
    margin-top: 0;
}

.lesson-list {
    display: grid;
    gap: 8px;
}

.lesson-item {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    color: #334155;
}

.lesson-item:hover {
    background: #f1f5f9;
}

.lesson-item.active {
    background: #eff6ff;
    color: #1d4ed8;
    font-weight: 800;
}

.lesson-item.completed {
    color: #059669;
}

.lesson-item-number {
    display: inline-flex;
    width: 27px;
    height: 27px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #e2e8f0;
    margin-right: 7px;
    font-size: 12px;
}

.lesson-item.active .lesson-item-number {
    background: #2563eb;
    color: #ffffff;
}

.lesson-item.completed .lesson-item-number {
    background: #10b981;
    color: #ffffff;
}


/* =====================================================
   LESSON CONTENT
===================================================== */

.lesson-content {
    background: #ffffff;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(15,23,42,.06);
    min-height: 600px;
}

.lesson-badge {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .05em;
}

.lesson-content h2 {
    font-size: clamp(30px, 5vw, 46px);
    margin: 17px 0 12px;
    line-height: 1.1;
}

.lesson-intro {
    color: #64748b;
    font-size: 17px;
    line-height: 1.8;
}

.lesson-body {
    margin-top: 30px;
    line-height: 1.8;
    color: #334155;
}

.lesson-body h3 {
    margin-top: 30px;
    color: #111827;
}

.lesson-body ul {
    padding-left: 22px;
}

.lesson-body li {
    margin-bottom: 9px;
}

.lesson-note {
    margin: 25px 0;
    padding: 20px;
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    border-radius: 10px;
}

.lesson-example {
    margin: 25px 0;
    padding: 20px;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 12px;
    overflow-x: auto;
}

.lesson-example pre {
    margin: 0;
    white-space: pre-wrap;
}


/* =====================================================
   ACTIONS
===================================================== */

.lesson-actions {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid #e5e7eb;
}

.lesson-actions button {
    border: 0;
    cursor: pointer;
}


/* =====================================================
   COMPLETE BUTTON
===================================================== */

.complete-button.completed {
    background: #059669;
}


/* =====================================================
   QUIZ
===================================================== */

.lesson-quiz {
    margin-top: 35px;
    padding: 25px;
    border-radius: 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
}

.quiz-question {
    font-weight: 800;
    margin-bottom: 15px;
}

.quiz-option {
    display: block;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    cursor: pointer;
}

.quiz-option:hover {
    background: #ffffff;
}

.quiz-result {
    margin-top: 15px;
    font-weight: 800;
}


/* =====================================================
   COMPLETION CARD
===================================================== */

.course-complete {
    display: none;
    margin-top: 30px;
    padding: 25px;
    border-radius: 18px;
    background: #ecfdf5;
    border: 1px solid #10b981;
}

.course-complete.show {
    display: block;
}

.course-complete h3 {
    color: #047857;
    margin-top: 0;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .lesson-layout {
        grid-template-columns: 1fr;
    }

    .lesson-sidebar {
        order: 2;
    }

    .lesson-content {
        order: 1;
    }
