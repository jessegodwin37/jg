    /* =========================================================
       JG COURSE — PAGE SPECIFIC STYLES
       ========================================================= */

    .course-page {
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HERO */

    .course-hero {
      position: relative;
      overflow: hidden;
      padding: clamp(30px, 6vw, 70px) 0 35px;
    }

    .course-hero::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -210px;
      right: -150px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.11);
      pointer-events: none;
    }

    .course-hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      left: -170px;
      bottom: -200px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.09);
      pointer-events: none;
    }

    .course-hero-inner {
      position: relative;
      z-index: 1;
    }

    .course-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .course-breadcrumb a {
      color: var(--muted);
    }

    .course-breadcrumb a:hover {
      color: var(--primary);
    }

    .course-breadcrumb-current {
      color: var(--text);
      font-weight: 700;
    }

    .course-hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
      gap: 30px;
      align-items: center;
    }

    .course-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      font-size: 0.77rem;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .course-label span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
    }

    .course-hero h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .course-gradient {
      background: linear-gradient(
        120deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .course-hero-description {
      max-width: 720px;
      margin: 19px 0 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 1rem;
    }

    .course-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    /* HERO COURSE PREVIEW */

    .course-preview {
      position: relative;
      overflow: hidden;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    .course-preview-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 17px;
    }

    .course-preview-logo {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background:

          135deg,
          rgba(37, 99, 235, 0.14),
          rgba(124, 58, 237, 0.14)
        );
      border: 1px solid var(--border);
      font-size: 1.2rem;
      font-weight: 900;
    }

      padding: 7px 9px;

      color: #15803d;
      font-size: 0.72rem;
      font-weight: 800;
    }

      margin: 0;
      font-size: 1.2rem;
    }
