<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JG Account | Student Dashboard</title>

<meta name="description"
      content="Manage your JG learning profile, course progress, exams and certificates.">

<link rel="stylesheet"
      href="css/style.css">

<style>

/* =====================================================
   JG ACCOUNT DASHBOARD
===================================================== */

.account-page {
    min-height: 100vh;
    padding: 120px 20px 80px;
    background: #f5f7fb;
}

.account-container {
    max-width: 1150px;
    margin: auto;
}


/* =====================================================
   DASHBOARD HERO
===================================================== */

.account-hero {
    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a
        );

    color: #ffffff;
    border-radius: 28px;
    padding: 45px;
    margin-bottom: 25px;
    position: relative;
    overflow: hidden;
}

.account-hero::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    right: -100px;
    top: -100px;
}

.account-hero-content {
    position: relative;
    z-index: 2;
}

.account-hero .badge {
    background: rgba(255,255,255,.12);
    color: #ffffff;
}

.account-hero h1 {
    font-size: clamp(34px, 6vw, 58px);
    margin: 18px 0 10px;
    line-height: 1.05;
}

.account-hero p {
    max-width: 650px;
    color: rgba(255,255,255,.8);
    line-height: 1.7;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(15,23,42,.07);
    margin-bottom: 25px;
}

.profile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
}

.profile-user {
    display: flex;
    align-items: center;
    gap: 17px;
}

.profile-avatar {
    width: 72px;
    height: 72px;
    min-width: 72px;
    border-radius: 50%;
    background: #2563eb;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
}

.profile-user h2 {
    margin: 0 0 5px;
}

.profile-user p {
    margin: 0;
    color: #64748b;
}


/* =====================================================
   PROFILE FORM
===================================================== */

.profile-form {
    display: none;
    border-top: 1px solid #e5e7eb;
    padding-top: 25px;
    margin-top: 25px;
}

.profile-form.open {
    display: block;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 800;
    margin-bottom: 8px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 15px;
    border: 1px solid #cbd5e1;
    border-radius: 11px;
    font: inherit;
    outline: none;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,.10);
}


/* =====================================================
   MESSAGE
===================================================== */

.account-message {
    display: none;
    padding: 14px 16px;
    border-radius: 11px;
    margin-bottom: 18px;
    line-height: 1.6;
}

.account-message.success {
    display: block;
    background: #ecfdf5;
    border: 1px solid #10b981;
    color: #065f46;
}

.account-message.error {
    display: block;
    background: #fef2f2;
    border: 1px solid #ef4444;
    color: #991b1b;
}


/* =====================================================
   STATS
===================================================== */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 12px 35px rgba(15,23,42,.06);
}

.stat-icon {
    font-size: 25px;
    margin-bottom: 12px;
}

.stat-number {
    font-size: 30px;
    font-weight: 900;
    color: #111827;
}

.stat-label {
    margin-top: 5px;
    color: #64748b;
    font-size: 14px;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.dashboard-section {
    margin: 40px 0 20px;
}

.dashboard-section h2 {
    margin: 10px 0;
    font-size: 30px;
}

.dashboard-section p {
    color: #64748b;
}


/* =====================================================
   COURSE GRID
===================================================== */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.dashboard-course {
    background: #ffffff;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 12px 35px rgba(15,23,42,.06);
    transition: transform .2s ease, box-shadow .2s ease;
}

.dashboard-course:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 45px rgba(15,23,42,.10);
}

.course-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-bottom: 18px;
}

.dashboard-course h3 {
    margin-bottom: 8px;
}

.dashboard-course p {
    color: #64748b;
    line-height: 1.6;
}


/* =====================================================
   COURSE PROGRESS
===================================================== */

.progress {
    width: 100%;
    height: 9px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0 8px;
}

.progress span {
    display: block;
    width: 0%;
    height: 100%;
    background: #2563eb;
    border-radius: inherit;
    transition: width .5s ease;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
}


/* =====================================================
   CERTIFICATE CARD
===================================================== */

.certificate-card {
    background: linear-gradient(
        135deg,
        #ffffff,
        #eff6ff
    );

    border: 1px solid #dbeafe;
    border-radius: 22px;
    padding: 30px;
    margin-top: 25px;
}

.certificate-card h2 {
    margin-top: 0;
}

.certificate-id {
    display: inline-block;
    background: #ffffff;
    border: 1px dashed #93c5fd;
    border-radius: 10px;
    padding: 12px 15px;
    margin: 12px 0;
    font-weight: 800;
    word-break: break-word;
}

.certificate-status {
    color: #64748b;
    line-height: 1.7;
}

.verified {
    color: #059669;
    font-weight: 900;
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.quick-action {
    background: #ffffff;
    border-radius: 18px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 12px 35px rgba(15,23,42,.06);
    transition: transform .2s ease;
}

.quick-action:hover {
    transform: translateY(-3px);
}

.quick-action-icon {
    font-size: 28px;
    margin-bottom: 12px;
}

.quick-action h3 {
    margin: 0 0 7px;
}

.quick-action p {
    color: #64748b;
    margin: 0;
    line-height: 1.5;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .quick-actions {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 650px) {

    .account-page {
        padding: 105px 15px 60px;
    }

    .account-hero {
        padding: 30px 22px;
    }

    .profile-card {
        padding: 22px;
    }

    .profile-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 400px) {

    .stats-grid {
        grid-template-columns: 1fr;
    }

}

</style>
