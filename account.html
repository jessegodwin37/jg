<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="JG Account — Manage your learning, skills, certificates and work profile."
    >

    <meta name="theme-color" content="#f7f8fc">

    <title>JG Account | Your Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================================
           JG ACCOUNT
           Premium dashboard layer
           Light + Dark + Mobile-first
        ========================================================= */

        .account-page {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           ACCOUNT HERO
        ========================================================= */

        .account-hero {
            position: relative;
            overflow: hidden;
            padding: 42px 0 35px;
            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(37, 99, 235, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(124, 58, 237, 0.07),
                    transparent 30%
                );
        }

        .account-hero::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            right: -170px;
            top: -170px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            pointer-events: none;
        }

        .account-hero .container {
            position: relative;
            z-index: 2;
        }

        .account-welcome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .welcome-left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        .account-avatar {
            width: 76px;
            height: 76px;
            flex: 0 0 76px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
            color: #fff;
            font-size: 1.55rem;
            font-weight: 850;
            box-shadow:
                0 12px 30px rgba(37, 99, 235, 0.22);
        }

        .welcome-text h1 {
            margin: 3px 0 7px;
            font-size: clamp(1.65rem, 4vw, 2.35rem);
            letter-spacing: -0.04em;
        }

        .welcome-text p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .account-hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        /* =========================================================
           MAIN ACCOUNT LAYOUT
        ========================================================= */

        .account-layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .account-sidebar {
            position: sticky;
            top: 95px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            padding: 10px;
        }

        .account-nav {
            display: grid;
            gap: 4px;
        }

        .account-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            min-height: 46px;
            padding: 10px 12px;
            border-radius: 14px;
            color: var(--muted);
            text-decoration: none;
