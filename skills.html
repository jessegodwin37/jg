<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="description"
    content="JG Skills — Discover valuable skills, learn faster and connect your skills to opportunities."
  >

  <meta name="theme-color" content="#2563eb">

  <title>Skills | JG — Find Skills. Find Work.</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       JG SKILLS
       Premium Skill Discovery Experience
    ========================================================= */

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--background);
    }

    .skills-page {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(37, 99, 235, 0.08),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 18%,
          rgba(124, 58, 237, 0.07),
          transparent 28%
        ),
        var(--background);
    }

    /* =========================================================
       HERO
    ========================================================= */

    .skills-hero {
      padding: 58px 20px 30px;
    }

    .skills-hero-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .skills-hero-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 42px;
      background:
        linear-gradient(
          135deg,
          rgba(37, 99, 235, 0.11),
          rgba(124, 58, 237, 0.08),
          rgba(6, 182, 212, 0.05)
        ),
        var(--surface);
      box-shadow: var(--shadow-md);
    }

    .skills-hero-card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      right: -100px;
      top: -110px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.09);
      pointer-events: none;
    }

    .skills-hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
    }

    .skills-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      margin-bottom: 17px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .skills-eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    .skills-hero h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.02;
      letter-spacing: -0.05em;
    }

    .skills-hero h1 span {
      background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .skills-hero-description {
      max-width: 700px;
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .skills-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 25px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .skills-stats {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .skill-stat {
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .skill-stat strong {
      display: block;
      color: var(--text);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .skill-stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.4;
    }

    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .skills-main {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto 70px;
    }

    .skills-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

       FILTER SIDEBAR
    ========================================================= */

    .skills-filter {
      position: sticky;
