<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <meta name="description"
          content="Explore digital skills on JG and start building skills that can create opportunities.">

    <title>JG Skills | Learn Skills. Build Your Future.</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        /* =====================================================
           SKILLS PAGE
        ===================================================== */

        .page-hero {

            width: min(
                calc(100% - 40px),
                900px
            );

            margin: auto;

            text-align: center;

            padding: 85px 0 55px;
        }


        .page-hero h1 {

            font-size:
                clamp(
                    42px,
                    7vw,
                    68px
                );

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 20px;
        }


        .page-hero h1 span {

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .page-hero p {

            max-width: 650px;

            margin: auto;

            color: var(--text-secondary);

            font-size: 17px;
        }


        /* =====================================================
           SKILLS FILTER
        ===================================================== */

        .skills-controls {

            width: min(
                calc(100% - 40px),
                var(--max-width)
            );

            margin: 0 auto 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;
        }


        .skills-search {

            flex: 1;

            min-width: 220px;

            position: relative;
        }


        .skills-search input {

            padding-left: 43px;

            min-height: 48px;
        }


        .search-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--text-muted);

            pointer-events: none;
        }


        .skill-filters {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;
        }


        .filter-btn {

            min-height: 42px;

            padding:
                0 14px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background:
                var(--surface);

            color:
                var(--text-secondary);

            font-size: 12px;

            font-weight: 700;
        }


        .filter-btn.active {

            color: white;

            border-color:
                var(--primary);

            background:
                var(--primary);
        }


        /* =====================================================
           SKILLS GRID
        ===================================================== */

        .skills-grid {

            width: min(
                calc(100% - 40px),
                var(--max-width)
            );

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .skill-card {

            position: relative;

            overflow: hidden;

            padding: 30px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-lg);

            background:
                var(--surface);

            box-shadow:
                var(--shadow-sm);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }


        .skill-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                var(--shadow);

            border-color:
                rgba(
                    37,
                    99,
                    235,
                    .25
                );
        }


        .skill-card::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            background:
                rgba(
                    37,
                    99,
                    235,
                    .06
                );

            filter: blur(45px);

            right: -70px;

            top: -70px;

            pointer-events: none;
        }


        .skill-card-top {

            display: flex;

            align-items: flex-start;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom: 22px;
        }


        .skill-icon {

            width: 58px;

            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 17px;

            background:
                rgba(
                    37,
                    99,
                    235,
                    .09
                );

            font-size: 27px;
        }


        .skill-level {

            padding:
                6px 9px;

            border-radius:
                999px;

            background:
                var(--bg-soft);

            color:
                var(--text-muted);

            font-size: 10px;

            font-weight: 750;
        }


        .skill-card h2 {

            font-size: 23px;

            letter-spacing:
                -.5px;

            margin-bottom: 9px;
        }


        .skill-card > p {

            color:
                var(--text-secondary);

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 22px;
        }


        .skill-topics {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 25px;
        }


        .skill-topic {

            padding:
                6px 9px;

            border:
                1px solid var(--border);

            border-radius:
                8px;

            color:
                var(--text-muted);

            background:
                var(--bg-soft);

            font-size: 10px;

            font-weight: 650;
        }


        .skill-card-bottom {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            padding-top: 20px;

            border-top:
                1px solid var(--border);
        }


        .skill-meta {

            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .skill-meta strong {

            font-size: 14px;
        }


        .skill-meta span {

            color:
                var(--text-muted);

            font-size: 11px;
        }
