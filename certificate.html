<head>

    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

    <title>JG Certificate | Certificate of Completion</title>

    <meta name="description"
          content="JG Certificate of Completion">

          href="css/style.css">

    <style>

        /* =========================
           CERTIFICATE PAGE
        ========================= */

        .certificate-page {
            min-height: 100vh;
            padding: 120px 20px 70px;
            background: #f5f7fb;
        }

        .certificate-wrapper {
            max-width: 1100px;
            margin: auto;
        }

        .certificate-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .certificate {
            position: relative;
            background: white;
            border: 12px solid #111827;
            padding: 55px;
            min-height: 650px;
            box-shadow: 0 20px 60px rgba(0,0,0,.12);
            text-align: center;
            overflow: hidden;
        }

        .certificate::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px solid #2563eb;
            pointer-events: none;
        }

        .certificate-logo {
            position: relative;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        .certificate-logo span {
            color: #2563eb;
        }

        .certificate-label {
            position: relative;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #6b7280;
        }

        .certificate h1 {
            position: relative;
            margin: 20px 0 10px;
            font-size: clamp(38px, 6vw, 70px);
            line-height: 1;
        }

        .certificate-subtitle {
            position: relative;
            color: #6b7280;
            font-size: 18px;
        }

        .student-name {
            position: relative;
            margin: 35px 0 15px;
            font-size: clamp(30px, 5vw, 54px);
            font-weight: 800;
        }

        .certificate-text {
            position: relative;
            max-width: 700px;
            margin: auto;
            color: #4b5563;
            line-height: 1.8;
        }

        .course-name {
            position: relative;
            margin: 20px auto;
            font-size: 30px;
            font-weight: 800;
            color: #2563eb;
        }

        .certificate-meta {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 750px;
            margin: 45px auto 20px;
        }

        .certificate-meta div {
            padding: 15px;
            border-top: 1px solid #d1d5db;
        }

        .certificate-meta strong {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 7px;
        }

        .certificate-meta span {
            font-weight: 700;
        }

        .certificate-footer {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 30px;
            max-width: 800px;
            margin: 45px auto 0;
        }

        .signature {
            min-width: 200px;
        }

        .signature-line {
            border-top: 1px solid #111827;
            padding-top: 8px;
            font-weight: 700;
        }

        .verification-seal {
            width: 90px;
            height: 90px;
            border: 3px solid #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: #2563eb;
            text-align: center;
            margin: auto;
        }

        .certificate-note {
            max-width: 800px;
            margin: 25px auto 0;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .certificate-form {
            max-width: 700px;
            margin: 0 auto 35px;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .certificate-form h2 {
            margin-top: 0;
        }

        .certificate-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .certificate-form input,
        .certificate-form select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            margin-bottom: 15px;
            font: inherit;
            box-sizing: border-box;
        }

        .certificate-form button {
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {

            .certificate {
                padding: 40px 25px;
                border-width: 7px;
            }

            .certificate-meta {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .certificate-footer {
                flex-direction: column;
                align-items: center;
            }

        }

        @media print {

            body {
                background: white;
            }

            .navbar,
            .certificate-actions,
            .certificate-form,
            footer {
                display: none !important;
            }

            .certificate-page {
                padding: 0;
                background: white;
            }

            .certificate {
                box-shadow: none;
                min-height: 90vh;
                border-width: 10px;
            }

        }

    </style>

</head>
