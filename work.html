    /* =========================================================
       JG WORK — PAGE-SPECIFIC STYLES
       ========================================================= */

    .work-page {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .work-hero {
      position: relative;
      padding: clamp(32px, 6vw, 72px) 0 28px;
      overflow: hidden;
    }

    .work-hero::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      top: -160px;
      right: -140px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.12);
      filter: blur(4px);
      pointer-events: none;
    }

    .work-hero::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      bottom: -170px;
      left: -120px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.10);
      pointer-events: none;
    }

    .work-hero-inner {
      position: relative;
      z-index: 1;
    }

    .work-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .work-kicker-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.10);
    }

    .work-hero h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .work-gradient-text {
      background: linear-gradient(
        120deg,
        var(--primary),
        var(--secondary),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .work-hero p {
      max-width: 700px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(0.98rem, 2vw, 1.1rem);
      line-height: 1.75;
    }

    .work-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .work-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 32px;
    }

    .work-stat {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .work-stat strong {
      display: block;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }

    .work-stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .work-search-section {
      position: relative;
      z-index: 2;
      margin-top: 4px;
    }
