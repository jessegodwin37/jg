<style>

/* =========================================
   PAGE
========================================= */

.verify-page {
    min-height: 100vh;
    padding: 130px 20px 90px;
    background: #f5f7fb;
}

.verify-container {
    width: 100%;
    max-width: 950px;
    margin: auto;
}


/* =========================================
   HEADER
========================================= */

.verify-header {
    text-align: center;
    margin-bottom: 40px;
}

.verify-header h1 {
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1.05;
    margin: 20px 0;
    color: #111827;
}

.verify-header h1 span {
    color: #2563eb;
}

.verify-header p {
    max-width: 680px;
    margin: auto;
    color: #64748b;
    line-height: 1.8;
    font-size: 17px;
}


/* =========================================
   VERIFY CARD
========================================= */

.verify-box {
    background: #ffffff;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.08);
}

.verify-box h2 {
    margin-top: 0;
    color: #111827;
}

.verify-box-description {
    color: #64748b;
    line-height: 1.7;
}


/* =========================================
   FORM
========================================= */

.verify-box label {
    display: block;
    margin: 25px 0 9px;
    font-weight: 800;
    color: #111827;
}

.verify-input-row {
    display: flex;
    gap: 12px;
}

.verify-input-row input {
    flex: 1;
    min-width: 0;
    padding: 16px 18px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font: inherit;
    font-size: 16px;
    outline: none;
    transition: .2s;
}

.verify-input-row input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,.10);
}

.verify-input-row button {
    border: none;
    cursor: pointer;
    white-space: nowrap;
}


/* =========================================
   RESULT
========================================= */

.result {
    margin-top: 30px;
    padding: 30px;
    border-radius: 18px;
    display: none;
}

.result.success {
    display: block;
    background: #ecfdf5;
    border: 1px solid #10b981;
    color: #064e3b;
}

.result.error {
    display: block;
    background: #fef2f2;
    border: 1px solid #ef4444;
    color: #7f1d1d;
}

.result h2 {
    margin-top: 0;
    margin-bottom: 10px;
}

.result p {
    line-height: 1.7;
}


/* =========================================
   VERIFIED ICON
========================================= */

.verify-status-icon {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #10b981;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 18px;
}

.invalid-icon {
    background: #ef4444;
}


/* =========================================
   DETAILS
========================================= */

.result-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 25px;
}

.result-details div {
    padding: 16px;
    background: rgba(255,255,255,.75);
    border-radius: 12px;
}

.result-details strong {
    display: block;
    font-size: 11px;
    letter-spacing: .7px;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 7px;
}

.result-details span {
    font-weight: 800;
    word-break: break-word;
}


/* =========================================
   STATUS
========================================= */

.status-verified {
    color: #059669 !important;
}

.status-invalid {
    color: #dc2626 !important;
}


/* =========================================
   INFO
========================================= */

.verify-info {
    margin-top: 25px;
    padding: 28px;
    background: #eef4ff;
    border-radius: 18px;
}

.verify-info h3 {
    margin-top: 0;
    color: #111827;
}

.verify-info p {
    color: #475569;
    line-height: 1.8;
}

.verify-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.verify-step {
    background: #ffffff;
    padding: 20px;
    border-radius: 14px;
}

.verify-step-number {
    font-size: 25px;
    margin-bottom: 10px;
}

.verify-step h4 {
    margin: 5px 0;
}

.verify-step p {
    font-size: 14px;
    margin: 0;
}


/* =========================================
   PRIVACY NOTICE
========================================= */

.demo-notice {
    margin-top: 25px;
    padding: 18px;
    border-radius: 12px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    font-size: 14px;
    line-height: 1.7;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 700px) {

    .verify-page {
        padding-top: 110px;
    }

    .verify-box {
        padding: 25px 20px;
    }

    .verify-input-row {
        flex-direction: column;
    }

    .verify-input-row button {
        width: 100%;
    }

    .result-details {
        grid-template-columns: 1fr;
    }

    .verify-steps {
        grid-template-columns: 1fr;
    }

}

</style>

</head>
