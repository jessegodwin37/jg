<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta

        content="JG Learn — Build practical skills through structured learning."
    >

    <meta name="theme-color" content="#f7f8fc">

    <title>JG Learn | Find Skills. Find Work.</title>

        /* =========================================================
           JG LEARN — PREMIUM PAGE LAYER
           Works with the global JG light/dark theme
        ========================================================= */

        .learn-page {
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* ---------- Premium hero ---------- */

        .learn-hero {
            position: relative;
            overflow: hidden;
        }

        .learn-hero::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            top: -180px;
            right: -140px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.10);
            filter: blur(8px);
            pointer-events: none;
        }

        .learn-hero::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            bottom: -180px;
            left: -120px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.08);
            filter: blur(8px);
            pointer-events: none;
        }

        .learn-hero .container {
            position: relative;
            z-index: 2;
        }

        .learning-stat-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 30px;
            max-width: 760px;
        }

        .learning-stat {
            padding: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .learning-stat:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .learning-stat strong {
            display: block;
            font-size: 1.35rem;
            line-height: 1.1;
            margin-bottom: 5px;
        }

        .learning-stat span {
            color: var(--muted);
            font-size: 0.86rem;
        }

        /* ---------- Progress dashboard ---------- */

        .learning-dashboard {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 20px;
        }

        .learning-card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--shadow-sm);
        }

        .learning-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -100px;
            right: -70px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.06);
            pointer-events: none;
        }

        .learning-card > * {
            position: relative;
            z-index: 1;
        }

        .learning-card-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 24px;
        }

        .learning-card-heading h3 {
            margin: 5px 0 0;
        }

        .learning-card-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(37, 99, 235, 0.10);
            color: var(--primary);
            font-weight: 800;
        }

        .progress-large {
            margin: 20px 0;
        }

        .progress-large .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .progress-large .progress-label strong {
            color: var(--primary);
        }

        .progress-large .progress-track {
            width: 100%;
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--surface-2);
        }

        .progress-large .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
