<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <meta name="description"
          content="Learn practical digital skills with JG courses in Web Development, Graphic Design, Video Editing and Python Programming.">

    <title>JG Learn | Build Skills. Build Your Future.</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        /* =====================================================
           LEARN PAGE
        ===================================================== */

        .learn-hero {

            width: min(
                calc(100% - 40px),
                900px
            );

            margin: auto;

            text-align: center;

            padding: 85px 0 55px;
        }


        .learn-hero h1 {

            font-size:
                clamp(
                    42px,
                    7vw,
                    68px
                );

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 20px;
        }


        .learn-hero h1 span {

            display: block;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .learn-hero p {

            max-width: 650px;

            margin: auto;

            color: var(--text-secondary);

            font-size: 17px;
        }


        /* =====================================================
           LEARNING STATS
        ===================================================== */

        .learning-stats {

            width: min(
                calc(100% - 40px),
                var(--max-width)
            );

            margin:
                0 auto 60px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;
        }


        .learning-stat {

            padding: 20px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            background:
                var(--surface);

            text-align: center;
        }


        .learning-stat strong {

            display: block;

            font-size: 24px;

            margin-bottom: 3px;
        }


        .learning-stat span {

            color:
                var(--text-muted);

            font-size: 11px;
        }


        /* =====================================================
           COURSE SECTION
        ===================================================== */

        .courses-section {

            width: min(
                calc(100% - 40px),
                var(--max-width)
            );

            margin:
                0 auto 90px;
        }


        .courses-heading {

            display: flex;

            align-items: flex-end;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 30px;
        }


        .courses-heading h2 {

            font-size: 30px;

            letter-spacing:
                -1px;
        }


        .courses-heading p {

            color:
                var(--text-muted);

            font-size: 13px;
        }


        /* =====================================================
           COURSE GRID
        ===================================================== */

        .course-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .course-card {

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-lg);

            background:
                var(--surface);

            box-shadow:
                var(--shadow-sm);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }


        .course-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                var(--shadow);
        }


        .course-cover {

            min-height: 190px;

            padding: 25px;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items:
                flex-end;
        }


        .course-cover::before {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            filter:
                blur(10px);

            right: -70px;

            top: -80px;
        }


        .course-cover.web {

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4f46e5
                );
        }


        .course-cover.design {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #db2777
                );
        }


        .course-cover.video {

            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #ea580c
                );
        }


        .course-cover.python {

            background:
                linear-gradient(
                    135deg,
                    #047857,
                    #0891b2
                );
        }


        .course-icon {

            position: relative;

            z-index: 2;

            width: 60px;

            height: 60px;

            display: grid;

            place-items: center;

            border-radius:
                17px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .15
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .2
                );

            backdrop-filter:
                blur(12px);

            font-size: 28px;
        }


        .course-cover-label {

            position: absolute;

            z-index: 2;

            top: 20px;

            right: 20px;

            padding:
                6px 9px;

            border-radius:
                999px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .2
                );

            color: white;

            font-size: 10px;

            font-weight: 750;
        }


        .course-content {

            padding: 25px;
        }


        .course-topline {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            margin-bottom: 10px;
        }


        .course-level {

            color:
                var(--primary);

            font-size: 10px;

            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                .8px;
        }
